name: Deploy to Firebase Hosting (manual or on push)
on:
  workflow_dispatch:
  push:
    branches:
      - Firebase-Deploy
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Build CSS (if needed)
        run: npm run build:css || echo "CSS build not required"
      - name: Deploy Firestore security rules
        uses: w9jds/firebase-action@v13.25.0
        with:
          args: deploy --only firestore:rules --project dispatch-board-12bb8
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISPATCH_BOARD_12BB8 }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISPATCH_BOARD_12BB8 }}
          channelId: live
          projectId: dispatch-board-12bb8
