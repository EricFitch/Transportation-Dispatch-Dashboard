<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management - Dispatch Command Center</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/icons/Logo.png">
    <link rel="stylesheet" href="./dist/css/main.css">
    <link rel="stylesheet" href="./src/styles/main.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <style>
        .staff-card {
            transition: all 0.3s ease;
            border-left: 4px solid #cbd5e1;
        }
        .staff-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-active { background-color: #dcfce7; color: #166534; }
        .status-on-leave { background-color: #fef3c7; color: #92400e; }
        .status-training { background-color: #dbeafe; color: #1e40af; }
    </style>
</head>

                    <button id="add-staff-btn"

                    </div>

                                <select id="bulk-default-department" class="w-full p-2 border rounded text-sm" aria-label="Bulk default department">

                                    <option value="Dispatch">Dispatch</option>
                                    <option value="Maintenance">Maintenance</option>
                                    <option value="Administration">Administration</option>
                                </select>
                            </div>

    <!-- Add Staff Form Section (Collapsible) -->

        <div class="bg-white rounded-lg shadow-sm overflow-hidden">

                                <input type="text" id="staff-first-name" class="w-full p-2 border rounded" aria-required="true" required>
                            </div>
                            <div>
                                <label for="staff-last-name" class="block text-sm font-medium text-gray-700 mb-1">Last Name *</label>
                                <input type="text" id="staff-last-name" class="w-full p-2 border rounded" aria-required="true" required>
                            </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="staff-employee-id" class="block text-sm font-medium text-gray-700 mb-1">Employee ID</label>
                                <input type="text" id="staff-employee-id" class="w-full p-2 border rounded" aria-label="Employee ID">

                                    <option value="Safety Escort">Safety Escort</option>
                                    <option value="Mechanic">Mechanic</option>

                    <button onclick="closeStaffModal()" aria-label="Close staff details modal" title="Close" class="text-gray-400 hover:text-gray-600">

    <!-- Scripts: load core modules and the staff module, then initialize page interactions -->
    <script type="module" src="src/modules/core/state.js"></script>
    <script type="module" src="src/modules/core/events.js"></script>
    <script type="module" src="src/modules/core/utils.js"></script>
    <script type="module" src="src/modules/dispatch/staff.js"></script>

    <script type="module">
        (function () {
            const containerId = 'staff-cards-container';
            const searchEl = document.getElementById('staff-search');
            const roleFilterEl = document.getElementById('role-filter');
            const statusFilterEl = document.getElementById('status-filter');
            const resetBtn = document.getElementById('reset-filters');

            function applyFilters() {
                const opts = {
                    search: searchEl.value.trim(),
                    role: roleFilterEl.value,
                    status: statusFilterEl.value
                };
                if (window.renderStaffDetailsPage) {
                    window.renderStaffDetailsPage(containerId, opts);
                } else {
                    console.warn('renderStaffDetailsPage not available yet');
                }
            }

            searchEl.addEventListener('input', () => requestAnimationFrame(applyFilters));
            roleFilterEl.addEventListener('change', applyFilters);
            statusFilterEl.addEventListener('change', applyFilters);
            resetBtn.addEventListener('click', () => {
                searchEl.value = '';
                roleFilterEl.value = '';
                statusFilterEl.value = '';
                applyFilters();
            });

            document.getElementById('export-staff-data').addEventListener('click', () => {
                if (typeof window.exportStaffListAsCSV === 'function') {
                    window.exportStaffListAsCSV();
                } else if (typeof window.exportStaffData === 'function') {
                    const data = window.exportStaffData();
                    // fallback CSV creation
                    const headers = ['Name','Role','Employee ID','Status','Department','Phone','Email'];
                    const rows = [headers.join(',')];
                    (data.available || []).forEach(s => {
                        rows.push([s.name || '', s.role || '', s.employeeId || '', s.status || '', s.department || '', s.phone || '', s.email || ''].map(f => `"${(f||'').toString().replace(/"/g,'""')}"`).join(','));
                    });
                    const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `staff_list_${new Date().toISOString().split('T')[0]}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } else {
                    alert('Export function not available');
                }
            });

            document.getElementById('add-staff-btn').addEventListener('click', () => {
                const formContent = document.getElementById('add-staff-form-content');
                const toggleBtn = document.getElementById('toggle-add-staff-form');
                if (formContent && toggleBtn) {
                    // Expand form if collapsed
                    if (formContent.classList.contains('hidden')) {
                        formContent.classList.remove('hidden');
                        const icon = toggleBtn.querySelector('.toggle-icon');
                        if (icon) icon.style.transform = 'rotate(180deg)';
                    }
                    // Scroll to form
                    toggleBtn.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });

            // Delegated click handler: details/assign
            document.addEventListener('click', (e) => {
                const target = e.target;
                if (target.classList && target.classList.contains('staff-details-btn')) {
                    const name = target.dataset.staffName;
                    if (typeof window.showStaffDetails === 'function') window.showStaffDetails(name);
                }
                if (target.classList && target.classList.contains('staff-assign-btn')) {
                    const name = target.dataset.staffName;
                    if (typeof window.assignDriver === 'function') {
                        window.assignDriver(name);
                    } else if (typeof window.showStaffDetails === 'function') {
                        window.showStaffDetails(name);
                    }
                }
            });

            function tryInitialRender() {
                // If the renderer is available, call it immediately. Don't rely on window.STATE being exposed.
                if (typeof window.renderStaffDetailsPage === 'function') {
                    try {
                        window.renderStaffDetailsPage(containerId, {});
                        return;
                    } catch (err) {
                        console.warn('renderStaffDetailsPage threw during initial render, will retry:', err);
                    }
                }

                // If event bus exists, render once state:dataUpdated fires (covers delayed data loads)
                if (window.eventBus && typeof window.eventBus.on === 'function') {
                    window.eventBus.on('state:dataUpdated', () => {
                        if (typeof window.renderStaffDetailsPage === 'function') {
                            try { window.renderStaffDetailsPage(containerId, {}); } catch (e) { /* ignore */ }
                        }
                    });
                }

                // Otherwise retry until the staff module registers the renderer
                setTimeout(tryInitialRender, 200);
            }

            tryInitialRender();
        })();
    </script>
    <script>
        // Staff Management Functionality - Collapsible Sections, CSV Import, Form Submission
        (function() {
            console.log('👥 Setting up staff management functionality...');

            // Collapsible sections
            const setupCollapsible = (toggleBtnId, contentId) => {
                const toggleBtn = document.getElementById(toggleBtnId);
                const content = document.getElementById(contentId);
                if (toggleBtn && content) {
                    toggleBtn.addEventListener('click', () => {
                        const isHidden = content.classList.contains('hidden');
                        content.classList.toggle('hidden');
                        const icon = toggleBtn.querySelector('.toggle-icon');
                        if (icon) {
                            icon.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
                        }
                    });
                }
            };

            setupCollapsible('toggle-csv-import', 'csv-import-content');
            setupCollapsible('toggle-add-staff-form', 'add-staff-form-content');

            // Staff form submission
            const staffForm = document.getElementById('add-staff-form');
            if (staffForm) {
                staffForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    const formData = {
                        firstName: document.getElementById('staff-first-name').value.trim(),
                        lastName: document.getElementById('staff-last-name').value.trim(),
                        employeeId: document.getElementById('staff-employee-id').value.trim(),
                        role: document.getElementById('staff-position').value.trim(),
                        department: document.getElementById('staff-department').value,
                        status: document.getElementById('staff-status').value,
                        phone: document.getElementById('staff-phone').value.trim(),
                        email: document.getElementById('staff-email').value.trim(),
                        notes: document.getElementById('staff-notes').value.trim()
                    };

                    if (!formData.firstName || !formData.lastName) {
                        showStaffStatus('First name and last name are required.', true);
                        return;
                    }

                    try {
                        const editingId = staffForm.dataset.editingId;
                        
                        if (editingId) {
                            // Update existing staff member using staff module function
                            if (typeof window.updateStaffMember === 'function') {
                                window.updateStaffMember(editingId, formData);
                            } else {
                                throw new Error('updateStaffMember function not available');
                            }
                            delete staffForm.dataset.editingId;
                            
                            // Reset button text
                            const submitBtn = staffForm.querySelector('button[type="submit"]');
                            if (submitBtn) {
                                submitBtn.textContent = 'Add Staff Member';
                                submitBtn.className = 'px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700';
                            }
                        } else {
                            // Add new staff member
                            if (typeof window.addNewStaffMember === 'function') {
                                window.addNewStaffMember(formData);
                            }
                        }

                        // Clear form
                        staffForm.reset();
                        showStaffStatus('✅ Staff member saved successfully!', false);
                        
                        // Refresh the staff list
                        if (typeof window.renderStaffDetailsPage === 'function') {
                            window.renderStaffDetailsPage('staff-cards-container', {});
                        }
                        
                        // Collapse form after successful save
                        setTimeout(() => {
                            const formContent = document.getElementById('add-staff-form-content');
                            const toggleBtn = document.getElementById('toggle-add-staff-form');
                            if (formContent && formContent.classList.contains('hidden') === false) {
                                formContent.classList.add('hidden');
                                const icon = toggleBtn?.querySelector('.toggle-icon');
                                if (icon) icon.style.transform = 'rotate(0deg)';
                            }
                        }, 1500);
                        
                    } catch (error) {
                        console.error('Error saving staff member:', error);
                        showStaffStatus('❌ Error saving staff member. Please try again.', true);
                    }
                });
            }

            // Cancel button
            const cancelBtn = document.getElementById('cancel-add-staff');
            if (cancelBtn) {
                cancelBtn.addEventListener('click', () => {
                    staffForm.reset();
                    const formContent = document.getElementById('add-staff-form-content');
                    const toggleBtn = document.getElementById('toggle-add-staff-form');
                    if (formContent) {
                        formContent.classList.add('hidden');
                        const icon = toggleBtn?.querySelector('.toggle-icon');
                        if (icon) icon.style.transform = 'rotate(0deg)';
                    }
                    const statusElement = document.getElementById('staff-form-status');
                    if (statusElement) statusElement.remove();
                });
            }

            // Note: updateStaffMember function is now provided by the staff module

            // Show status message
            const showStaffStatus = (message, isError) => {
                const staffForm = document.getElementById('add-staff-form');
                if (!staffForm) return;
                
                let statusElement = document.getElementById('staff-form-status');
                if (!statusElement) {
                    statusElement = document.createElement('div');
                    statusElement.id = 'staff-form-status';
                    statusElement.className = 'mt-3 p-3 rounded text-sm';
                    staffForm.appendChild(statusElement);
                }
                
                statusElement.className = `mt-3 p-3 rounded text-sm ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
                statusElement.textContent = message;
                
                // Auto-hide success messages
                if (!isError) {
                    setTimeout(() => {
                        statusElement?.remove();
                    }, 5000);
                }
            };

            // CSV Import functionality
            const csvDropZone = document.getElementById('staff-csv-drop-zone');
            const csvFileInput = document.getElementById('staff-csv-file-input');

            if (csvDropZone && csvFileInput) {
                // File input change handler
                csvFileInput.addEventListener('change', (e) => {
                    if (e.target.files.length > 0) {
                        handleStaffCSVFile(e.target.files[0]);
                    }
                });

                // Drag and drop handlers
                csvDropZone.addEventListener('click', () => {
                    csvFileInput.click();
                });

                csvDropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    csvDropZone.classList.add('border-purple-500', 'bg-purple-200');
                });

                csvDropZone.addEventListener('dragleave', () => {
                    csvDropZone.classList.remove('border-purple-500', 'bg-purple-200');
                });

                csvDropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    csvDropZone.classList.remove('border-purple-500', 'bg-purple-200');
                    
                    if (e.dataTransfer.files.length > 0) {
                        handleStaffCSVFile(e.dataTransfer.files[0]);
                    }
                });
            }

            const handleStaffCSVFile = async (file) => {
                if (!file.name.toLowerCase().endsWith('.csv')) {
                    showStaffCSVStatus('❌ Please select a CSV file.', true);
                    return;
                }

                try {
                    showStaffCSVStatus('⏳ Processing CSV file...', false);
                    
                    if (typeof window.handleStaffCSVImport === 'function') {
                        const result = await window.handleStaffCSVImport(file);
                        showStaffCSVStatus(`✅ Successfully imported ${result.imported} out of ${result.total} staff members.`, false);
                        
                        // Refresh the staff list
                        if (typeof window.renderStaffDetailsPage === 'function') {
                            window.renderStaffDetailsPage('staff-cards-container', {});
                        }
                        
                        // Auto-collapse CSV section after successful import
                        setTimeout(() => {
                            const csvContent = document.getElementById('csv-import-content');
                            const toggleBtn = document.getElementById('toggle-csv-import');
                            if (csvContent && csvContent.classList.contains('hidden') === false) {
                                csvContent.classList.add('hidden');
                                const icon = toggleBtn?.querySelector('.toggle-icon');
                                if (icon) icon.style.transform = 'rotate(0deg)';
                            }
                        }, 3000);
                    } else {
                        throw new Error('CSV import function not available');
                    }
                    
                } catch (error) {
                    console.error('Error processing staff CSV:', error);
                    showStaffCSVStatus(`❌ Error: ${error.message}`, true);
                }
            };

            const showStaffCSVStatus = (message, isError) => {
                const statusElement = document.getElementById('staff-csv-status');
                if (!statusElement) return;
                
                statusElement.className = `mt-3 p-3 rounded text-sm ${isError ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`;
                statusElement.textContent = message;
                
                // Auto-hide messages after delay
                setTimeout(() => {
                    statusElement.textContent = '';
                    statusElement.className = 'mt-3 text-sm';
                }, isError ? 8000 : 5000);
            };

            console.log('✅ Staff management functionality ready');
        })();
    </script>
    <script>
        // Optional demo data trigger: append ?demo=true to the URL to populate sample staff
        (function () {
            try {
                const params = new URLSearchParams(window.location.search);
                if (params.get('demo') === 'true' && typeof window.addSampleStaffForTesting === 'function') {
                    // Small delay to ensure module initialization
                    setTimeout(() => window.addSampleStaffForTesting(), 300);
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
</body>
</html>
