<!DOCTYPE html>
<html>
<head><title>Debug Assets</title></head>
<body>
<h1>Asset Debug Tool</h1>
<button onclick="checkAssets()">Check Assets in LocalStorage</button>
<button onclick="addTestAsset()">Add Test Asset</button>
<button onclick="clearAssets()">Clear All Assets</button>
<pre id="output"></pre>
<script>
function checkAssets() {
    const data = localStorage.getItem('dispatchConfig');
    const output = document.getElementById('output');
    if (!data) {
        output.textContent = 'No dispatchConfig found in localStorage';
        return;
    }
    const parsed = JSON.parse(data);
    output.textContent = 'Assets in localStorage:\n' + JSON.stringify(parsed.assets, null, 2);
    console.log('Full dispatchConfig:', parsed);
}

function addTestAsset() {
    const data = localStorage.getItem('dispatchConfig');
    let config = data ? JSON.parse(data) : { routes: [], staff: [], assets: [] };
    
    if (!config.assets) config.assets = [];
    
    const testAsset = {
        name: 'TEST-' + Date.now(),
        type: 'Bus',
        capacity: 50,
        status: 'active'
    };
    
    config.assets.push(testAsset);
    localStorage.setItem('dispatchConfig', JSON.stringify(config));
    
    alert('Test asset added: ' + testAsset.name);
    checkAssets();
}

function clearAssets() {
    if (!confirm('Clear all assets?')) return;
    const data = localStorage.getItem('dispatchConfig');
    if (!data) return;
    const config = JSON.parse(data);
    config.assets = [];
    localStorage.setItem('dispatchConfig', JSON.stringify(config));
    alert('Assets cleared');
    checkAssets();
}

// Auto-check on load
checkAssets();
</script>
</body>
</html>
